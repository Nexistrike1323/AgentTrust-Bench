[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrust-bench"
version = "1.3.0"
description = "Offline-first security evaluation harness for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agenttrust-bench = "agenttrust_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
